name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Playwright E2E Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Playwright Browsers and OS Dependencies
        run: npx --prefix frontend playwright install --with-deps

      # =========================================================================
      # CI Database Limitation Note:
      # This workflow relies on the backend's local JSON fallback (database/database.json)
      # rather than spinning up a full PostgreSQL + pgvector container in CI.
      # This provides fast, zero-dependency testing for PR verification.
      # =========================================================================
      - name: Start Backend Server
        run: |
          python backend/main.py &
          sleep 5

      - name: Run Playwright Tests
        run: npx --prefix frontend playwright test
        env:
          NODE_PATH: frontend/node_modules
          CI: true

      - name: Upload Playwright HTML Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
